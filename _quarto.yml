project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - writing.qmd
    - blog.qmd
    - photography.qmd
    - posts/**/index.qmd

website:
  title: "Rodi"
  site-url: "https://mrodiduger.github.io"
  search: false

lang: en
date-format: "DD MMM YYYY"

format:
  html:
    theme: none
    css: assets/css/site.css
    include-in-header: _includes/head.html
    include-before-body: _includes/site-header.html
    include-after-body: _includes/site-footer.html
    toc: false
    anchor-sections: false
    title-block-banner: false
    html-math-method: mathjax
    page-layout: article

execute:
  freeze: auto
